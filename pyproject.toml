[project]
name = "pepkio-ddct-clarity"
version = "0.1.0"
description = "Python client for Pepkio ddct-clarity tool"
readme = "README.md"
authors = [
    { name = "Pepkio", email = "support@pepkio.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.scripts]
pepkio-ddct-clarity = "pepkio_ddct_clarity.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.1",
]
